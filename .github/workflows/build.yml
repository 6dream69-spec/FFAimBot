name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Generate clean Gradle wrapper
        run: |
          # 1. Purani corrupted files delete karo
          rm -rf gradle/wrapper gradlew gradlew.bat

          # 2. Temp directory banao aur blank settings file dalo taaki Gradle allow kare
          mkdir -p /tmp/wrapper-gen
          touch /tmp/wrapper-gen/settings.gradle
          (cd /tmp/wrapper-gen && gradle wrapper --gradle-version 8.5)

          # 3. Fresh official files ko project me copy karo
          mkdir -p gradle/wrapper
          cp /tmp/wrapper-gen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
          cp /tmp/wrapper-gen/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          cp /tmp/wrapper-gen/gradlew ./gradlew

          # 4. Linux permissions set karo
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
