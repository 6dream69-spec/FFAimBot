name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Ensure Gradle Wrapper and gradlew exist
        run: |
          mkdir -p gradle/wrapper

          # 1. Create properties if missing
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          # 2. Download wrapper JAR if missing
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://github.com/android/architecture-samples/raw/main/gradle/wrapper/gradle-wrapper.jar
          fi

          # 3. If gradlew is missing, empty, or not a valid shell script, download official wrapper
          if [ ! -s gradlew ] || ! grep -q '#!/bin/sh' gradlew 2>/dev/null; then
            echo "Fetching fresh Unix gradlew script..."
            curl -sSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          fi

          # 4. Strip UTF-8 BOM, remove CRLF (\r), and set executable permissions
          sed -i '1s/^\xEF\xBB\xBF//' gradlew
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
